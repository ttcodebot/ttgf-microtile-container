name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttgf26c
        with:
          pdk: gf180mcuD
          # This branch appends the netlists of the micro tiles to the submitted netlist
          tools-repo: ttcodebot/tt-support-tools
          tools-ref: microtile-shuttle-gf

      # Independent check on the final GDS: every micro tile must be powered from
      # the Metal4 power pins of the container. The second run is a negative control.
      - name: Trace micro tile power
        shell: bash
        run: |
          python test/trace_power.py runs/wokwi/final/gds/tt_um_micro_tiles_group_1.gds
          ! python test/trace_power.py runs/wokwi/final/gds/tt_um_micro_tiles_group_1.gds --cut tt_um_micro_sweep

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttgf26c

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttgf26c
