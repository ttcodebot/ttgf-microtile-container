# The micro tiles of this container. assemble.py generates the rest from this file.
#
# Each micro tile is identified by the GitHub Actions run that hardened it: the
# `tt_submission` artifact of that run holds its layout, netlist, docs and commit.
# The position in the list is the value on uio_in[1:0] that selects the micro tile.

shuttle: ttgf26c
container: tt_um_micro_tiles_group_1

# All micro tiles must be built with this flow and PDK (pdk.json of the artifact):
pdk:
  FLOW_NAME: LibreLane
  FLOW_VERSION: 3.0.14
  PDK: gf180mcuD
  PDK_SOURCE: open_pdks
  PDK_VERSION: 54435919abffb937387ec956209f9cf5fd2dfbee

micro_tiles:
  - repo: ttcodebot/ttgf-microtile # branch tools-microtile: counter / input mirror
    run: 43833284573
  - repo: ttcodebot/ttgf-microtile # branch mt-wokwi-457572218833202177
    run: 43889021973
  - repo: ttcodebot/ttgf-microtile # branch mt-wokwi-455303592417686529
    run: 43889028525
  - repo: ttcodebot/ttgf-microtile # branch mt-sweep-28-3: dense generated design
    run: 43889044259
